# Answer key for target_app_js/ (Express + Sequelize, JavaScript and TypeScript).
# Same format as ground_truth.yml - see its header. Run:
#   python -m scanner.evaluate target_app_js --ground-truth ground_truth_js.yml
#
# This small app exists to test the JavaScript / TypeScript support, so it only judges the
# rules whose detectors read JS (out_of_scope lists the rest; findings for them are set
# aside, not counted as false positives). Every planted issue sits next to a decoy that
# must NOT be reported.

target: target_app_js

planted:
  - id: JS-01
    rule_id: DPDP-SEC-004
    file: config.js
    line: 4
    anchor: "jwtSecret: '"
    clue: pattern
    note: JWT signing secret hard-coded in config.js.

  - id: JS-02
    rule_id: DPDP-SEC-002
    file: models.js
    line: 10
    anchor: "pan: DataTypes.STRING"
    clue: structure
    note: Sequelize User model stores the PAN as a plain STRING.

  - id: JS-03
    rule_id: DPDP-RET-001
    file: models.js
    line: 20
    anchor: "Lead.init({"
    clue: absence
    note: Lead holds email and mobile number, but no code ever destroys or anonymises leads.

  - id: JS-04
    rule_id: DPDP-SEC-001
    file: server.ts
    line: 21
    anchor: "console.log('New signup', req.body.email, req.body.phone)"
    clue: structure
    note: Signup writes email and phone to the console log.

  - id: JS-05
    rule_id: DPDP-SEC-005
    file: server.ts
    line: 31
    anchor: "app.get('/api/users/:id'"
    clue: structure
    note: GET /api/users/:id returns the whole user record with no auth middleware (IDOR).

  - id: JS-06
    rule_id: DPDP-CON-001
    scope: project
    file: server.ts
    line: 46
    anchor: "app.post('/consent'"
    clue: absence
    note: POST /consent grants consent; no route withdraws it.

  - id: JS-07
    rule_id: DPDP-SEC-005
    file: server.ts
    line: 60
    anchor: "app.get('/api/customers/:id', asyncHandler(getCustomer()))"
    clue: structure
    note: Handler imported from routes/customers.ts (via require and a wrapper) returns email and phone with no auth.

  - id: JS-08
    rule_id: DPDP-SEC-006
    file: server.ts
    line: 33
    anchor: "res.json(user)"
    clue: structure
    note: The whole User record (PAN and the password hash) from User.findByPk is sent to the client.

  - id: JS-09
    rule_id: DPDP-SEC-006
    file: server.ts
    line: 43
    anchor: "res.json(await User.findAll())"
    clue: structure
    note: Every User record with PAN and password hash is sent; admin-only, but the fields are still not needed.

  - id: JS-10
    rule_id: DPDP-SEC-006
    file: routes/customers.ts
    line: 13
    anchor: "res.json(await User.findAll())"
    clue: structure
    note: Same in a handler defined in routes/customers.ts and wired in server.ts.

  - id: JS-11
    rule_id: DPDP-CON-004
    file: routes/marketing.ts
    line: 11
    anchor: "mailer.sendPromo(user?.email"
    clue: structure
    note: sendOffers emails promotions to the user without checking the marketing consent the app records (Consent model).

  - id: JS-12
    rule_id: DPDP-CON-003
    file: models.js
    line: 28
    anchor: "const Consent = sequelize.define('Consent'"
    clue: structure
    note: Consent is a bare yes/no flag (timestamps off, no purpose or notice version), so the app cannot prove when or to what a user agreed.

  - id: JS-13
    rule_id: DPDP-RT-001
    scope: project
    file: models.js
    line: 7
    anchor: "const User = sequelize.define('User'"
    clue: absence
    note: Users can sign up and delete their account, but no route lets them see or export their own data.

  - id: JS-14
    rule_id: DPDP-RT-002
    scope: project
    file: models.js
    line: 7
    anchor: "const User = sequelize.define('User'"
    clue: absence
    note: DELETE /api/me erases an account, but no route lets users correct their data (no PUT/PATCH on their own record).

  - id: JS-15
    rule_id: DPDP-RT-003
    scope: project
    clue: absence
    note: No grievance or contact route or page and no grievance officer or DPO contact anywhere.

  - id: JS-16
    rule_id: DPDP-SEC-007
    file: server.ts
    line: 31
    anchor: "app.get('/api/users/:id'"
    clue: absence
    note: Reads a user (email, phone, PAN) and writes no audit or log entry, although the app has a winston logger.

  - id: JS-17
    rule_id: DPDP-SEC-007
    file: server.ts
    line: 42
    anchor: "app.get('/admin/users'"
    clue: absence
    note: Lists every user with no audit entry.

  - id: JS-18
    rule_id: DPDP-SEC-007
    file: server.ts
    line: 60
    anchor: "app.get('/api/customers/:id'"
    clue: absence
    note: The handler in routes/customers.ts reads a user with no audit entry.

  - id: JS-19
    rule_id: DPDP-SEC-007
    file: server.ts
    line: 61
    anchor: "app.get('/admin/customers'"
    clue: absence
    note: The handler in routes/customers.ts lists users with no audit entry.

  - id: JS-20
    rule_id: DPDP-SEC-010
    file: logger.ts
    line: 9
    anchor: "maxFiles: '14d'"
    clue: config
    note: Daily log files are deleted after 14 days; Rule 8(3) requires keeping logs for at least a year.

  - id: JS-21
    rule_id: DPDP-NOT-001
    file: public/lead.html
    line: 10
    anchor: '<form method="post" action="/leads">'
    clue: absence
    note: The quote form asks for email, mobile and Aadhaar with no notice of what is collected or why.

  - id: JS-22
    rule_id: DPDP-BR-001
    scope: project
    file: models.js
    line: 7
    anchor: "const User = sequelize.define('User'"
    clue: absence
    note: The app holds user data but has no breach or incident handling, no user or Board notification and no alert hook.

  - id: JS-23
    rule_id: DPDP-CON-005
    file: public/lead.html
    line: 14
    anchor: 'name="aadhaar"'
    clue: absence
    note: The quote form asks for an Aadhaar number that no handler reads and the Lead model does not store.

  - id: JS-24
    rule_id: DPDP-CON-006
    file: public/lead.html
    line: 17
    anchor: "I agree to be contacted about this quote."
    clue: absence
    note: The consent text is English only and the app has no translations, i18n library or locale files.

  - id: JS-25
    rule_id: DPDP-SEC-009
    file: infra/main.tf
    line: 6
    anchor: 'resource "aws_db_instance" "shop"'
    clue: config
    note: The shop database has automated backups turned off (backup_retention_period = 0).

  - id: JS-26
    rule_id: DPDP-TP-002
    file: infra/main.tf
    line: 3
    anchor: 'region = "us-east-1"'
    clue: config
    note: The database holding user data is in us-east-1, outside India (info - allowed unless restricted).

  - id: JS-27
    rule_id: DPDP-RET-003
    file: jobs/purgeInactive.ts
    line: 8
    anchor: "export async function purgeInactiveUsers ()"
    clue: absence
    note: The nightly job deletes accounts unused for three years without warning users 48 hours before.

compliant:
  - rule_id: DPDP-SEC-004
    note: dbPassword and dbStorage come from process.env.
  - rule_id: DPDP-SEC-002
    note: User.password is hashed with bcrypt in the model's setter.
  - rule_id: DPDP-RET-001
    note: users can be erased (User.destroy in DELETE /api/me).
  - rule_id: DPDP-SEC-001
    note: logger.info logs only the internal user id.
  - rule_id: DPDP-SEC-005
    note: GET /api/leads/:id uses requireAuth; GET /admin/users and /admin/customers (handler in routes/customers.ts) are guarded by app.use('/admin', requireAuth).
  - rule_id: DPDP-CON-004
    note: "sendNewsletter (routes/marketing.ts) checks Consent.findOne(... marketing: true) before emailing."
  - rule_id: DPDP-CON-005
    note: name, email and mobile on the quote form are Lead columns, stored by Lead.create(req.body).
  - rule_id: DPDP-SEC-007
    note: GET /api/leads/:id and the marketing handlers (routes/marketing.ts) log each read with logger.info.
  - rule_id: DPDP-SEC-006
    note: getCustomer (routes/customers.ts:8) picks email and phone from the User record; GET /api/leads/:id (server.ts:39) picks name and source.

