  - {rule_id: DPDP-SEC-003, note: Not judged by the JS fixture app; see target_app.}
  - {rule_id: DPDP-SEC-008, note: Not judged by the JS fixture app; see target_app.}
  - {rule_id: DPDP-TP-001, note: Not judged by the JS fixture app; see target_app.}
  - {rule_id: DPDP-RET-002, note: Not judged by the JS fixture app; see target_app.}
  - {rule_id: DPDP-CH-001, note: Not judged by the JS fixture app; see target_app.}
  - {rule_id: DPDP-CH-002, note: Not judged by the JS fixture app; see target_app.}

must_not_appear_in_report:
  - shop-demo-91b7e3c04d2a46f8a1c5e9d7b3f20c68
