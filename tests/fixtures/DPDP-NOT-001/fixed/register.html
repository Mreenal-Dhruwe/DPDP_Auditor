<!doctype html>
<html lang="en">
<body>
  <h1>Create your account</h1>
  <p class="notice">We collect your name, mobile number and PAN to open your account and to meet
    KYC rules. <a href="/privacy">Privacy notice</a></p>
  <form method="post" action="/register">
    <input name="full_name" placeholder="Full name">
    <input type="tel" name="contact_no" placeholder="Mobile">
    <input name="pan_no" placeholder="PAN">
    <button>Continue</button>
  </form>
</body>
</html>
